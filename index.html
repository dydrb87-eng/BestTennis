<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BEST TENNIS CLUB - 월례대회 경기 매칭 및 누적 통계</title>
  
  <!-- Google Fonts: Outfit & Noto Sans KR -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800;900&family=Outfit:wght@500;600;700;800;900&display=swap" rel="stylesheet">
  
  <!-- Phosphor Icons -->
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  
  <!-- SheetJS (xlsx) CDN for Excel reading/writing -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

  <style>
    /* Pure Vivid Green & 샛노랑 Tennis Theme */
    :root {
      --bg-primary: #042417;        /* Deep Green Court Base */
      --bg-secondary: #0a3825;      /* Court Green Container */
      --bg-card: rgba(10, 56, 37, 0.92);
      --border-color: rgba(255, 255, 255, 0.25);
      
      --vivid-green: #00B027;       /* 완전 초록색 */
      --vivid-green-hover: #008f1f;
      --vivid-yellow: #FFFF00;      /* 샛노란색 */
      --vivid-yellow-hover: #e6e600;
      
      --accent-blue: #3b82f6;
      --accent-pink: #ec4899;
      --danger: #ff3b3b;
      
      --text-main: #ffffff;
      --text-muted: #b0d9c4;
      --text-dark: #022013;
      
      --radius-sm: 10px;
      --radius-md: 16px;
      --radius-lg: 24px;
      --shadow-md: 0 10px 25px rgba(0, 0, 0, 0.5);
      --transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    /* Tiled Background with Image 2 (Smiling Leaf Tennis Ball Pattern) */
    body {
      font-family: 'Outfit', 'Noto Sans KR', sans-serif;
      background-color: var(--bg-primary);
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120' viewBox='0 0 100 100'><path d='M 38,20 C 30,2 40,-6 45,8 Z' fill='%2300B027' opacity='0.15'/><path d='M 62,20 C 70,2 60,-6 55,8 Z' fill='%2300B027' opacity='0.15'/><circle cx='50' cy='52' r='28' fill='%23FFFF00' opacity='0.08'/><path d='M 24,44 Q 50,34 76,44' fill='none' stroke='%23FFFFFF' stroke-width='2' opacity='0.15'/><circle cx='42' cy='48' r='2.5' fill='%23FFFFFF' opacity='0.2'/><circle cx='58' cy='48' r='2.5' fill='%23FFFFFF' opacity='0.2'/><path d='M 43,57 Q 50,63 57,57' fill='none' stroke='%23FFFFFF' stroke-width='2' opacity='0.2'/></svg>");
      background-repeat: repeat;
      background-size: 120px 120px;
      color: var(--text-main);
      line-height: 1.6;
      min-height: 100vh;
    }

    .container { max-width: 1480px; margin: 0 auto; padding: 24px 20px 80px; }

    /* HEADER WITH ADEQUATE TOP MARGIN & NO SUB-TITLE */
    header { display: flex; flex-direction: column; align-items: center; margin-top: 40px; margin-bottom: 32px; gap: 16px; text-align: center; }

    .title-logo-header {
      display: flex; align-items: center; justify-content: center; gap: 20px; flex-wrap: wrap; margin-bottom: 8px;
    }
    
    /* ENLARGED TITLE WITH B-COURT LOGO SLIGHTLY LARGER THAN LETTERS (1.15em) */
    .giant-title {
      font-size: clamp(3.6rem, 7vw, 6.0rem); font-weight: 900; letter-spacing: 0.02em;
      color: var(--vivid-yellow); text-shadow: 0 6px 25px rgba(0,0,0,0.7);
      display: flex; align-items: center; justify-content: center; line-height: 1;
      gap: 0;
    }
    .giant-title span.green-text { color: var(--vivid-green); text-shadow: 0 0 20px rgba(0, 176, 39, 0.6); }

    .logo-b-court {
      height: 1.15em; width: auto; vertical-align: middle; filter: drop-shadow(0 6px 16px rgba(0,0,0,0.6));
      margin-right: 0.08em;
    }

    .title-est-text {
      letter-spacing: 0.04em;
      word-spacing: 0.22em;
    }

    .logo-ball-smile {
      height: clamp(4.5rem, 8vw, 7.2rem); width: auto; vertical-align: middle; filter: drop-shadow(0 6px 18px rgba(255,255,0,0.5));
    }

    /* Admin Bar & Lock Badge Styling (Equalized Sizes) */
    .admin-bar {
      display: flex; align-items: center; gap: 14px; margin-top: 6px; flex-wrap: wrap; justify-content: center;
    }
    .admin-auth-btn {
      padding: 8px 18px; font-size: 1rem; font-weight: 700; border-radius: 25px;
    }
    .admin-status-badge {
      font-size: 1rem; font-weight: 700; color: var(--text-muted); background: rgba(255, 255, 255, 0.08); padding: 8px 18px; border-radius: 25px; border: 1.5px solid var(--border-color);
    }
    .admin-status-badge.active {
      color: var(--vivid-yellow); background: rgba(0, 176, 39, 0.3); border-color: var(--vivid-green); box-shadow: 0 0 12px rgba(0, 176, 39, 0.4);
    }

    .locked-btn {
      opacity: 0.65 !important;
      position: relative;
    }
    .locked-btn::after {
      content: '🔒';
      margin-left: 6px;
      font-size: 0.9em;
    }

    .nav-tabs {
      display: flex; background: var(--bg-secondary); padding: 8px; border-radius: 20px; border: 2px solid var(--border-color); gap: 8px; width: 100%; max-width: 820px; box-shadow: var(--shadow-md); margin-top: 8px;
    }
    .tab-btn {
      flex: 1; display: flex; align-items: center; justify-content: center; gap: 10px; padding: 16px 20px; background: transparent; border: none; color: var(--text-muted); font-size: 1.25rem; font-weight: 700; border-radius: 14px; cursor: pointer; transition: var(--transition);
    }
    .tab-btn:hover { color: var(--text-main); background: rgba(255, 255, 255, 0.08); }
    .tab-btn.active { background: var(--vivid-green); color: #ffffff; box-shadow: 0 4px 18px rgba(0, 176, 39, 0.5); }

    .tab-pane { display: none; animation: fadeIn 0.3s ease-in-out forwards; }
    .tab-pane.active { display: block; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

    .glass-panel {
      background: var(--bg-card); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border: 2px solid var(--border-color); border-radius: var(--radius-lg); padding: 30px; margin-bottom: 28px; box-shadow: var(--shadow-md);
    }
    .panel-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; flex-wrap: wrap; gap: 18px; }
    .panel-title { font-size: 1.6rem; font-weight: 800; display: flex; align-items: center; gap: 12px; color: #ffffff; }
    .panel-title i { color: var(--vivid-yellow); font-size: 1.8rem; }
    .sub-panel-title { font-size: 1.35rem; font-weight: 800; color: var(--text-main); display: flex; align-items: center; gap: 10px; }

    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 10px; padding: 14px 22px; font-size: 1.15rem; font-weight: 700; border-radius: var(--radius-sm); border: none; cursor: pointer; transition: var(--transition); outline: none;
    }
    .btn-primary { background: var(--vivid-green); color: white; box-shadow: 0 4px 14px rgba(0, 176, 39, 0.4); }
    .btn-primary:hover { background: var(--vivid-green-hover); transform: translateY(-2px); }
    .btn-yellow { background: var(--vivid-yellow); color: var(--text-dark); font-weight: 800; box-shadow: 0 4px 14px rgba(255, 255, 0, 0.3); }
    .btn-yellow:hover { background: var(--vivid-yellow-hover); transform: translateY(-2px); }
    .btn-secondary { background: rgba(255, 255, 255, 0.1); color: var(--text-main); border: 1.5px solid var(--border-color); }
    .btn-secondary:hover { background: rgba(255, 255, 255, 0.2); }
    .btn-danger { background: rgba(255, 59, 59, 0.2); color: #ff9999; border: 1.5px solid rgba(255, 59, 59, 0.4); }
    .btn-danger:hover { background: var(--danger); color: white; }
    .btn-accent { background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%); color: white; box-shadow: 0 4px 14px rgba(59, 130, 246, 0.4); }
    .btn-accent:hover { background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%); transform: translateY(-2px); }
    .btn-lg { padding: 16px 28px; font-size: 1.25rem; border-radius: var(--radius-md); }
    .btn-group { display: flex; gap: 12px; flex-wrap: wrap; }

    .dropzone {
      border: 3px dashed var(--vivid-yellow); border-radius: var(--radius-md); padding: 42px 24px; text-align: center; background: rgba(255, 255, 0, 0.05); cursor: pointer; transition: var(--transition); margin-bottom: 28px;
    }
    .dropzone:hover, .dropzone.dragover { border-color: #ffffff; background: rgba(255, 255, 0, 0.12); }
    .dropzone-icon { font-size: 3.5rem; color: var(--vivid-yellow); margin-bottom: 12px; }

    .stats-summary-bar { display: flex; gap: 20px; margin-bottom: 24px; flex-wrap: wrap; }
    .stat-pill { background: var(--bg-secondary); border: 1.5px solid var(--border-color); padding: 12px 22px; border-radius: 35px; display: flex; align-items: center; gap: 10px; font-size: 1.15rem; font-weight: 700; }
    .stat-pill strong { color: var(--vivid-yellow); font-size: 1.35rem; }
    .badge-m { background: rgba(59, 130, 246, 0.25); color: #93c5fd; border: 1px solid rgba(59, 130, 246, 0.4); padding: 3px 10px; border-radius: 8px; font-size: 1rem; font-weight: 700; display: inline-flex; align-items: center; }
    .badge-f { background: rgba(236, 72, 153, 0.25); color: #fbcfe8; border: 1px solid rgba(236, 72, 153, 0.4); padding: 3px 10px; border-radius: 8px; font-size: 1rem; font-weight: 700; display: inline-flex; align-items: center; }

    .table-responsive { width: 100%; overflow-x: auto; border-radius: var(--radius-md); border: 1.5px solid var(--border-color); }
    .custom-table { width: 100%; border-collapse: collapse; text-align: left; background: var(--bg-secondary); font-size: 1.2rem; }
    .custom-table th, .custom-table td { padding: 16px 18px; border-bottom: 1.5px solid var(--border-color); vertical-align: middle; }
    .custom-table th { background: rgba(0, 0, 0, 0.4); color: var(--text-muted); font-weight: 700; font-size: 1.1rem; text-transform: uppercase; letter-spacing: 0.05em; }
    .custom-table th.sortable { cursor: pointer; user-select: none; }
    .custom-table th.sortable:hover { color: var(--vivid-yellow); background: rgba(255, 255, 0, 0.1); }
    .custom-table tbody tr:hover { background: rgba(255, 255, 255, 0.04); }
    .custom-table input[type="text"], .custom-table select { background: rgba(0, 0, 0, 0.4); border: 1.5px solid var(--border-color); border-radius: var(--radius-sm); color: white; padding: 8px 14px; font-size: 1.15rem; width: 100%; font-weight: 600; }

    /* Tab 3 Table Columns Gap Shortened & Equalized */
    #statsTable th:nth-child(1) { width: 80px; text-align: center; }  /* 순위 */
    #statsTable th:nth-child(2) { width: 160px; }                     /* 선수명 */
    #statsTable th:nth-child(3) { width: 110px; text-align: center; } /* 경기수 */
    #statsTable th:nth-child(4) { width: 90px; text-align: center; }  /* 승 */
    #statsTable th:nth-child(5) { width: 90px; text-align: center; }  /* 패 */
    #statsTable th:nth-child(6) { width: 120px; text-align: center; } /* 승률 (%) */
    #statsTable th:nth-child(7) { width: 100px; text-align: center; } /* 득점 */
    #statsTable th:nth-child(8) { width: 100px; text-align: center; } /* 실점 */
    #statsTable th:nth-child(9) { width: 110px; text-align: center; } /* 득실차 */

    .month-sub-nav { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
    .month-pills-group { display: flex; gap: 8px; flex-wrap: wrap; }
    .month-pill { display: inline-flex; align-items: center; gap: 6px; padding: 8px 18px; border-radius: 25px; background: rgba(255, 255, 255, 0.08); border: 1.5px solid var(--border-color); color: var(--text-muted); font-size: 1.1rem; font-weight: 700; cursor: pointer; transition: var(--transition); user-select: none; }
    .month-pill.active { background: var(--vivid-green); color: white; border-color: var(--vivid-green); box-shadow: 0 4px 14px rgba(0, 176, 39, 0.5); }
    .month-pill.delete-mode { border-color: rgba(255, 59, 59, 0.6); background: rgba(255, 59, 59, 0.12); }
    .month-pill-delete-x { display: inline-flex; align-items: center; justify-content: center; width: 20px; height: 20px; border-radius: 50%; background: #ff4d4d; color: white; font-size: 0.85rem; font-weight: 900; margin-left: 4px; transition: var(--transition); }
    .month-pill-delete-x:hover { background: #ff0000; transform: scale(1.2); }

    .match-controls-bar { display: flex; justify-content: space-between; align-items: center; gap: 24px; flex-wrap: wrap; background: var(--bg-secondary); padding: 24px; border-radius: var(--radius-md); border: 2px solid var(--border-color); margin-bottom: 28px; }
    .mode-selector { display: flex; gap: 14px; align-items: center; }
    .radio-card-group { display: flex; gap: 12px; }
    .radio-card input { position: absolute; opacity: 0; cursor: pointer; }
    .radio-card label { display: flex; align-items: center; gap: 10px; padding: 12px 22px; background: rgba(255, 255, 255, 0.06); border: 1.5px solid var(--border-color); border-radius: var(--radius-sm); cursor: pointer; transition: var(--transition); font-weight: 700; font-size: 1.15rem; }
    .radio-card input:checked + label { background: rgba(0, 176, 39, 0.3); border-color: var(--vivid-green); color: var(--vivid-yellow); }
    .round-info-badge { background: rgba(255, 255, 0, 0.15); border: 1.5px solid rgba(255, 255, 0, 0.5); color: var(--vivid-yellow); padding: 8px 18px; border-radius: 25px; font-size: 1.15rem; font-weight: 800; }

    .matching-split-container { display: flex; gap: 28px; align-items: flex-start; }
    .left-participant-panel { width: 580px; flex-shrink: 0; background: var(--bg-secondary); border: 2px solid var(--border-color); border-radius: var(--radius-md); padding: 20px 18px; }
    .right-matches-panel { flex: 1; min-width: 0; }

    .participant-gender-columns { display: flex; gap: 14px; margin-bottom: 20px; }
    .gender-column { flex: 1; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
    .gender-column-title { font-size: 1.1rem; font-weight: 800; padding-bottom: 8px; border-bottom: 1.5px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; }

    .participant-v-item { background: rgba(0, 0, 0, 0.3); border: 1.5px solid var(--border-color); padding: 6px 8px; border-radius: var(--radius-sm); display: flex; justify-content: space-between; align-items: center; gap: 4px; font-size: 1.05rem; white-space: nowrap; flex-wrap: nowrap; overflow: hidden; }
    .participant-v-item.absent-item { opacity: 0.6; background: rgba(255, 59, 59, 0.1); border-color: rgba(255, 59, 59, 0.3); }
    .participant-v-item .name-box { display: flex; align-items: center; gap: 4px; font-weight: 700; white-space: nowrap; flex-shrink: 0; min-width: 0; }
    .participant-v-item .name-text { white-space: nowrap; }

    .btn-absent-toggle { width: 24px; height: 24px; border-radius: 50%; border: none; background: rgba(255, 59, 59, 0.25); color: #ff9999; display: inline-flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0; font-size: 0.9rem; }
    .btn-absent-toggle:hover { background: var(--danger); color: white; transform: scale(1.15); }
    .btn-restore-toggle { width: 24px; height: 24px; border-radius: 50%; border: none; background: rgba(0, 176, 39, 0.25); color: #82e38c; display: inline-flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0; font-size: 0.9rem; }
    .btn-restore-toggle:hover { background: var(--vivid-green); color: white; transform: scale(1.15); }

    .participant-v-item .count-tag { background: rgba(255, 255, 0, 0.2); color: var(--vivid-yellow); border: 1px solid rgba(255, 255, 0, 0.4); font-weight: 800; font-size: 0.92rem; padding: 2px 6px; border-radius: 14px; white-space: nowrap; flex-shrink: 0; }
    .late-bonus-badge { color: rgba(255, 255, 255, 0.85); font-size: 0.82rem; font-weight: 700; margin-left: 2px; margin-right: 2px; }
    .btn-adjust-count { width: 20px; height: 20px; border-radius: 50%; border: 1.5px solid var(--border-color); background: rgba(255, 255, 255, 0.12); color: #ffffff; display: inline-flex; align-items: center; justify-content: center; cursor: pointer; font-size: 0.8rem; font-weight: 800; line-height: 1; margin-left: 2px; transition: var(--transition); user-select: none; flex-shrink: 0; }
    .btn-adjust-count:hover { background: var(--vivid-green); color: #ffffff; border-color: var(--vivid-green); transform: scale(1.15); }
    .absent-section { margin-top: 18px; padding-top: 16px; border-top: 2px dashed var(--border-color); }
    .absent-section-title { font-size: 1.05rem; font-weight: 800; color: var(--danger); margin-bottom: 10px; display: flex; align-items: center; gap: 8px; }

    /* MATCH CARDS SCALED UP 1.5x FOR HIGH VISIBILITY */
    .matches-single-column-list { display: flex; flex-direction: column; gap: 24px; }
    .match-card { background: var(--bg-secondary); border: 2.5px solid var(--border-color); border-radius: var(--radius-md); padding: 24px; display: flex; flex-direction: column; gap: 16px; box-shadow: var(--shadow-md); }
    .match-card:hover { border-color: var(--vivid-yellow); transform: translateY(-3px); }
    .match-card-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid var(--border-color); padding-bottom: 12px; }
    
    .game-title { font-weight: 900; color: var(--vivid-yellow); font-size: 1.75rem; display: flex; align-items: center; gap: 12px; }
    .game-type-badge { background: var(--vivid-green); color: #ffffff; border: 1.5px solid #ffffff; padding: 4px 12px; border-radius: 8px; font-size: 1.15rem; font-weight: 800; box-shadow: 0 2px 8px rgba(0,176,39,0.4); }
    
    .match-card-actions { display: flex; align-items: center; gap: 12px; }
    .btn-card-delete { background: rgba(255, 59, 59, 0.2); color: #ff9999; border: 1.5px solid rgba(255, 59, 59, 0.4); padding: 6px 14px; border-radius: 8px; font-size: 1.05rem; font-weight: 700; cursor: pointer; }
    .btn-card-delete:hover { background: var(--danger); color: white; }

    /* Center-aligned Scaled Up Team Boxes (1.5x) */
    .teams-container { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
    .team-box { flex: 1; background: rgba(0, 0, 0, 0.35); padding: 18px 16px; border-radius: var(--radius-sm); border: 1.5px solid rgba(255, 255, 255, 0.1); display: flex; flex-direction: column; gap: 10px; align-items: center; text-align: center; }
    .team-box.winner { border-color: var(--vivid-yellow); background: rgba(255, 255, 0, 0.15); box-shadow: 0 0 15px rgba(255, 255, 0, 0.2); }
    .team-name { font-size: 1.05rem; text-transform: uppercase; color: var(--text-muted); font-weight: 800; display: flex; justify-content: center; align-items: center; gap: 8px; width: 100%; text-align: center; }
    .team-players { font-size: 1.35rem; font-weight: 700; color: white; display: flex; flex-direction: column; gap: 8px; align-items: center; justify-content: center; width: 100%; text-align: center; }
    .player-item {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      white-space: nowrap;
      text-align: center;
      padding: 4px 8px;
      border-radius: 8px;
      border: 1.5px solid transparent;
      box-sizing: border-box;
      transition: var(--transition);
    }
    
    /* Member replacement UI styling */
    .player-item.clickable-player {
      cursor: pointer;
    }
    .player-item.clickable-player:hover {
      background: rgba(255, 255, 0, 0.18);
      border-color: var(--vivid-yellow);
    }
    .player-item.selected-for-change {
      background: rgba(255, 255, 0, 0.28) !important;
      border: 2px solid var(--vivid-yellow) !important;
      box-shadow: 0 0 14px rgba(255, 255, 0, 0.7);
      animation: pulseHighlight 1.5s infinite alternate;
    }
    @keyframes pulseHighlight {
      0% { box-shadow: 0 0 8px rgba(255, 255, 0, 0.4); }
      100% { box-shadow: 0 0 18px rgba(255, 255, 0, 0.95); }
    }
    .badge-changing {
      background: var(--vivid-yellow);
      color: var(--text-dark);
      font-size: 0.85rem;
      font-weight: 900;
      padding: 2px 6px;
      border-radius: 6px;
      margin-left: 4px;
    }

    .replacement-banner {
      background: linear-gradient(135deg, rgba(255, 255, 0, 0.25) 0%, rgba(0, 176, 39, 0.25) 100%);
      border: 2px solid var(--vivid-yellow);
      padding: 10px 14px;
      border-radius: var(--radius-sm);
      margin-bottom: 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: 800;
      color: var(--vivid-yellow);
      font-size: 1rem;
      white-space: nowrap;
    }
    .btn-replace-target {
      background: var(--vivid-yellow);
      color: var(--text-dark);
      border: none;
      padding: 3px 8px;
      border-radius: 6px;
      font-weight: 800;
      font-size: 0.88rem;
      cursor: pointer;
      transition: var(--transition);
      white-space: nowrap;
      flex-shrink: 0;
    }
    .btn-replace-target:hover {
      background: var(--vivid-yellow-hover);
      transform: scale(1.05);
    }

    /* Member Change ON/OFF Toggle Switch Styling */
    .member-change-toggle-container {
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(0, 0, 0, 0.35);
      padding: 6px 14px;
      border-radius: 20px;
      border: 1.5px solid var(--border-color);
    }
    .toggle-label {
      font-size: 1.05rem;
      font-weight: 800;
      color: var(--text-main);
      display: flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
    }
    .btn-toggle-switch {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 14px;
      border-radius: 18px;
      border: 1.5px solid var(--border-color);
      font-size: 0.95rem;

    .btn-stats-toggle.included { background: rgba(0, 176, 39, 0.2); color: #82e38c; border-color: rgba(0, 176, 39, 0.4); }

    .player-select-dropdown { background: var(--bg-primary); color: var(--vivid-yellow); border: 1.5px solid var(--vivid-yellow); border-radius: 6px; padding: 3px 6px; font-size: 0.9rem; font-weight: 800; outline: none; cursor: pointer; }
    .blank-slot-item { background: rgba(255, 255, 0, 0.1) !important; border: 1.5px dashed var(--vivid-yellow) !important; padding: 4px 8px !important; }

    .month-filter-panel { background: var(--bg-secondary); border: 2px solid var(--border-color); border-radius: var(--radius-md); padding: 18px 24px; margin-bottom: 20px; display: flex; align-items: center; gap: 20px; flex-wrap: wrap; }
    .month-checkboxes-group { display: flex; gap: 14px; flex-wrap: wrap; }
    .month-checkbox-item { display: flex; align-items: center; gap: 8px; cursor: pointer; font-size: 1.15rem; font-weight: 700; background: rgba(255, 255, 255, 0.08); padding: 8px 16px; border-radius: 20px; border: 1.5px solid var(--border-color); }
    .month-checkbox-item input[type="checkbox"] { accent-color: var(--vivid-green); width: 20px; height: 20px; }

    .rank-badge { width: 36px; height: 36px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-weight: 900; font-size: 1.2rem; background: rgba(255, 255, 255, 0.15); color: var(--text-main); }
    .rank-1 { background: linear-gradient(135deg, #f59e0b, #d97706); color: #fff; box-shadow: 0 0 10px rgba(245, 158, 11, 0.5); }
    .rank-2 { background: linear-gradient(135deg, #9ca3af, #4b5563); color: #fff; }
    .rank-3 { background: linear-gradient(135deg, #b45309, #78350f); color: #fff; }

    .diff-positive { color: var(--vivid-yellow); font-weight: 800; }
    .diff-negative { color: var(--danger); font-weight: 800; }
    .diff-zero { color: var(--text-muted); }

    .toast-container {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10000;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      pointer-events: none;
    }
    .toast {

    @keyframes slideUpToast {

    <section id="tab-participants" class="tab-pane">
      <div class="glass-panel">

                <th class="sortable" data-sort="ptsWon" onclick="StatsManager.setSort('ptsWon')">득점</th>
                <th class="sortable" data-sort="ptsLost" onclick="StatsManager.setSort('ptsLost')">실점</th>

  <script>
    const Toast = {
      show(message, type = 'info') {
        let container = document.getElementById('toastContainer');
        if (!container) {
          container = document.createElement('div');
          container.id = 'toastContainer';
          container.className = 'toast-container';
          document.body.appendChild(container);
        }
        const toast = document.createElement('div');
        toast.className = `toast ${type === 'error' ? 'toast-error' : ''}`;
        toast.innerHTML = `<i class="ph ph-${type === 'error' ? 'warning-circle' : 'check-circle'}" style="font-size: 1.1rem; color: var(--vivid-yellow);"></i> <span>${message}</span>`;
        container.appendChild(toast);
        setTimeout(() => { toast.remove(); }, 2000);
      }
    };

    /* 🔒 관리자 인증 & 잠금/해제 모듈 */
    const AdminManager = {
      ADMIN_PW: '0001',
      isAdmin: false,

      init() {
        this.isAdmin = sessionStorage.getItem('TENNIS_ADMIN_AUTH') === 'true';
        this.updateUI();
      },

      getAdminPw() {
        return localStorage.getItem('TENNIS_ADMIN_PW') || this.ADMIN_PW;
      },

      promptChangePassword() {
        if (!this.checkAdmin('비밀번호 변경')) return;
        const cur = prompt('현재 관리자 비밀번호를 입력하세요:');
        if (cur !== this.getAdminPw()) {
          if (cur !== null) Toast.show('현재 비밀번호가 일치하지 않습니다.', 'error');
          return;
        }
        const newPw = prompt('새로운 관리자 비밀번호를 입력하세요:');
        if (!newPw || !newPw.trim()) {
          Toast.show('새 비밀번호를 입력해 주세요.', 'error');
          return;
        }
        const confirmPw = prompt('새로운 비밀번호를 한 번 더 입력하세요:');
        if (newPw.trim() !== confirmPw.trim()) {
          Toast.show('새 비밀번호 재입력이 일치하지 않습니다.', 'error');
          return;
        }
        localStorage.setItem('TENNIS_ADMIN_PW', newPw.trim());
        App.saveState();
        Toast.show('🔑 관리자 비밀번호가 성공적으로 변경되었습니다!');
      },

      toggleAdmin() {
        if (this.isAdmin) {
          this.isAdmin = false;
          sessionStorage.removeItem('TENNIS_ADMIN_AUTH');
          MatchingManager.isMemberChangeModeEnabled = false;
          MatchingManager.selectedPlayerForChange = null;
          Toast.show('관리자 로그아웃 되었습니다. (일반 회원 읽기 전용 뷰어 모드)');
        } else {
          const input = prompt('관리자 비밀번호를 입력하세요 (초기 비밀번호: 0001):');
          if (input === this.getAdminPw()) {
            this.isAdmin = true;
            sessionStorage.setItem('TENNIS_ADMIN_AUTH', 'true');
            Toast.show('관리자로 인증되었습니다! (모든 편집/생성 권한 해제)');
          } else if (input !== null) {
            Toast.show('비밀번호가 올바르지 않습니다.', 'error');
          }
        }
        this.updateUI();
        MatchingManager.render();
        ParticipantManager.render();
        StatsManager.calculateAndRender();
      },

      checkAdmin(actionName = '이 기능') {
        if (!this.isAdmin) {
          Toast.show(`🔒 ${actionName}은(는) 관리자 전용 기능입니다. 상단 [관리자 인증]을 완료해 주세요.`, 'error');
          return false;
        }
        return true;
      },

      updateUI() {
        const btn = document.getElementById('adminAuthBtn');
        const badge = document.getElementById('adminStatusBadge');
        const changePwBtn = document.getElementById('changeAdminPwBtn');

        if (btn && badge) {
          if (this.isAdmin) {
            btn.innerHTML = `<i class="ph ph-lock-key-open" style="color:var(--vivid-yellow)"></i> 🔓 관리자 로그아웃`;
            btn.className = 'btn btn-secondary admin-auth-btn';
            badge.textContent = '🔓 관리자 모드 (모든 편집/수정 해제됨)';
            badge.classList.add('active');
          } else {
            btn.innerHTML = `<i class="ph ph-lock-key"></i> 🔒 관리자 인증`;
            btn.className = 'btn btn-secondary admin-auth-btn';
            badge.textContent = '🔒 일반 회원 모드 (스코어 입력만 가능)';
            badge.classList.remove('active');
          }
        }
        if (changePwBtn) {
          changePwBtn.style.display = this.isAdmin ? 'inline-flex' : 'none';
        }

        const adminBtnIds = [
          'generateSetMatchBtn', 'generateSingleMatchBtn', 'deleteAllMatchesBtn',
          'toggleMonthDeleteModeBtn', 'addMonthBtn', 'addParticipantBtn', 'clearParticipantsBtn',
          'memberChangeToggleBtn'
        ];

        adminBtnIds.forEach(id => {
          const el = document.getElementById(id);
          if (el) {
            if (this.isAdmin) {
              el.classList.remove('locked-btn');
            } else {
              el.classList.add('locked-btn');
            }
          }
        });

        document.getElementsByName('matchMode').forEach(radio => {
          radio.disabled = !this.isAdmin;
        });
      }
    };

    /* 이전 경기 결과 엑셀 대량 업로드 모듈 */
    const MatchExcelImporter = {
      downloadMatchTemplate() {
        const data = [
          ['월례대회', '경기방식', '팀A선수1', '팀A선수2', '팀B선수1', '팀B선수2', '팀A점수', '팀B점수'],
          ['1월', '남복', '홍길동', '이몽룡', '박나달', '최조코비치', 6, 4],
          ['1월', '여복', '성춘향', '정샤라포바', '강윌리엄스', '임사발렌카', 5, 7],
          ['2월', '혼복', '홍길동', '성춘향', '박나달', '정샤라포바', 6, 3]
        ];
        const ws = XLSX.utils.aoa_to_sheet(data);
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, '이전경기기록');
        XLSX.writeFile(wb, '테니스_이전경기결과_양식.xlsx');
        Toast.show('이전 경기 결과 엑셀 양식이 다운로드되었습니다.');
      },

      handleMatchFileUpload(file) {
        if (!AdminManager.checkAdmin('이전 경기 엑셀 업로드')) return;
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (e) => {
          try {
            const data = new Uint8Array(e.target.result);
            const workbook = XLSX.read(data, { type: 'array' });
            const worksheet = workbook.Sheets[workbook.SheetNames[0]];
            const rows = XLSX.utils.sheet_to_json(worksheet, { header: 1 });
            this.parseMatchExcel(rows);
          } catch (err) {
            console.error(err);
            Toast.show('이전 경기 엑셀 파일을 읽는 중 오류가 발생했습니다.', 'error');
          }
        };
        reader.readAsArrayBuffer(file);
      },

      parseMatchExcel(rows) {
        if (!rows || rows.length < 2) {
          Toast.show('파일에 최소 1개 이상의 경기 결과 데이터가 필요합니다.', 'error');
          return;
        }

        const headers = rows[0].map(c => String(c || '').replace(/\s+/g, ''));
        
        let monthCol = -1, typeCol = -1;
        let a1Col = -1, a2Col = -1, b1Col = -1, b2Col = -1;
        let scoreACol = -1, scoreBCol = -1;

        headers.forEach((h, idx) => {
          if (h.includes('월례대회') || h.includes('월대회') || h === '월') monthCol = idx;
          else if (h.includes('방식') || h.includes('종목') || h.includes('타입')) typeCol = idx;
          
          else if (h.includes('팀A선수1') || h.includes('팀A_1') || h === '팀A1') a1Col = idx;
          else if (h.includes('팀A선수2') || h.includes('팀A_2') || h === '팀A2') a2Col = idx;
          else if (h.includes('팀B선수1') || h.includes('팀B_1') || h === '팀B1') b1Col = idx;
          else if (h.includes('팀B선수2') || h.includes('팀B_2') || h === '팀B2') b2Col = idx;
          
          else if (h.includes('팀A점수') || h.includes('점수A') || h.includes('득점A')) scoreACol = idx;
          else if (h.includes('팀B점수') || h.includes('점수B') || h.includes('득점B')) scoreBCol = idx;
        });

        if (monthCol === -1) monthCol = 0;
        if (typeCol === -1) typeCol = 1;
        if (a1Col === -1) a1Col = 2;
        if (a2Col === -1) a2Col = 3;
        if (b1Col === -1) b1Col = 4;
        if (b2Col === -1) b2Col = 5;
        if (scoreACol === -1) scoreACol = 6;
        if (scoreBCol === -1) scoreBCol = 7;

        let importedCount = 0;
        const playerMapByName = {};
        ParticipantManager.list.forEach(p => playerMapByName[p.name.trim()] = p);

        const getOrCreatePlayerId = (name, defaultGender = 'M') => {
          const trimmed = String(name || '').trim();
          if (!trimmed) return null;
          if (playerMapByName[trimmed]) return playerMapByName[trimmed].id;
          const newP = {
            id: 'p_' + Date.now() + '_' + Math.random().toString(36).substr(2, 5),
            name: trimmed,
            gender: defaultGender
          };
          ParticipantManager.list.push(newP);
          playerMapByName[trimmed] = newP;
          return newP.id;
        };

        for (let i = 1; i < rows.length; i++) {
          const row = rows[i];
          if (!row || row.length === 0) continue;

          let monthName = String(row[monthCol] || '1월').trim();
          if (!monthName.endsWith('월')) monthName += '월';

          const typeLabel = String(row[typeCol] || '복식').trim();
          const pA1 = getOrCreatePlayerId(row[a1Col], typeLabel.includes('여') ? 'F' : 'M');
          const pA2 = getOrCreatePlayerId(row[a2Col], typeLabel.includes('여') ? 'F' : 'M');
          const pB1 = getOrCreatePlayerId(row[b1Col], typeLabel.includes('여') ? 'F' : 'M');
          const pB2 = getOrCreatePlayerId(row[b2Col], typeLabel.includes('여') ? 'F' : 'M');

          if (!pA1 || !pA2 || !pB1 || !pB2) continue;

          const scA = String(row[scoreACol] !== undefined ? row[scoreACol] : '');
          const scB = String(row[scoreBCol] !== undefined ? row[scoreBCol] : '');

          if (!App.monthList.includes(monthName)) {
            App.monthList.push(monthName);
            App.monthList.sort((a, b) => parseInt(a) - parseInt(b));
          }
          if (!App.tournaments[monthName]) {
            App.tournaments[monthName] = { currentRound: 0, matches: [], pairingHistory: [], absentPlayers: [], matchMode: 'regular' };
          }
          if (!App.selectedStatsMonths.includes(monthName)) {
            App.selectedStatsMonths.push(monthName);
          }

          const t = App.tournaments[monthName];
          const matchObj = {
            id: 'm_' + Date.now() + '_' + Math.random().toString(36).substr(2, 5),
            round: Math.floor(t.matches.length / 3) + 1,
            gameNumber: t.matches.length + 1,
            mode: typeLabel.includes('혼') ? 'mixed' : 'regular',
            typeLabel: typeLabel,
            teamA: [pA1, pA2],
            teamB: [pB1, pB2],
            scoreA: scA,
            scoreB: scB
          };

          t.matches.push(matchObj);
          t.pairingHistory.push(`${pA1}_${pA2}`, `${pA2}_${pA1}`, `${pB1}_${pB2}`, `${pB2}_${pB1}`);
          importedCount++;
        }

        App.renderAllViews();
        App.saveState();
        Toast.show(`총 ${importedCount}개의 이전 경기 결과를 성공적으로 업로드했습니다!`);
      }
    };

    const ParticipantManager = {
      list: [],
      init() { this.bindEvents(); },
      bindEvents() {
        const fileInput = document.getElementById('excelFileInput');
        const dropzone = document.getElementById('dropzone');
        const addBtn = document.getElementById('addParticipantBtn');
        const clearBtn = document.getElementById('clearParticipantsBtn');
        const templateBtn = document.getElementById('downloadTemplateBtn');

        if (fileInput) fileInput.addEventListener('change', (e) => this.handleFileUpload(e.target.files[0]));
        if (addBtn) addBtn.addEventListener('click', () => this.addParticipant());
        if (clearBtn) clearBtn.addEventListener('click', () => this.clearAll());
        if (templateBtn) templateBtn.addEventListener('click', () => this.downloadTemplate());
      },
      handleFileUpload(file) {
        if (!AdminManager.checkAdmin('참가자 엑셀 업로드')) return;
        if (!file) return;
        const fileName = file.name.toLowerCase();
        if (fileName.endsWith('.xlsx') || fileName.endsWith('.xls') || fileName.endsWith('.csv')) {
          const reader = new FileReader();
          reader.onload = (e) => {
            try {
              const data = new Uint8Array(e.target.result);
              const workbook = XLSX.read(data, { type: 'array' });
              const firstSheetName = workbook.SheetNames[0];
              const worksheet = workbook.Sheets[firstSheetName];
              const jsonData = XLSX.utils.sheet_to_json(worksheet, { header: 1 });
              this.parseExcelData(jsonData);
            } catch (err) {
              console.error(err);
              Toast.show('엑셀 파일을 읽는 중 오류가 발생했습니다.', 'error');
            }
          };
          reader.readAsArrayBuffer(file);
        } else {
          Toast.show('.xlsx, .xls, .csv 확장자 파일만 지원합니다.', 'error');
        }
      },
      parseExcelData(rows) {
        if (!rows || rows.length === 0) { Toast.show('파일에 데이터가 없습니다.', 'error'); return; }
        let addedCount = 0; let startIdx = 0, nameCol = 0, genderCol = 1;
        const firstRow = rows[0].map(cell => String(cell || '').trim());
        if (firstRow.some(cell => cell.includes('이름') || cell.includes('성별') || cell.toLowerCase().includes('name'))) {
          startIdx = 1;
          firstRow.forEach((cell, idx) => {
            if (cell.includes('이름') || cell.toLowerCase().includes('name')) nameCol = idx;
            if (cell.includes('성별') || cell.toLowerCase().includes('gender')) genderCol = idx;
          });
        }
        const newList = [...this.list];
        for (let i = startIdx; i < rows.length; i++) {
          const row = rows[i]; if (!row || row.length === 0) continue;
          const name = String(row[nameCol] || '').trim();
          let rawGender = String(row[genderCol] || 'M').trim(), gender = 'M';
          if (rawGender === '여' || rawGender === '여성' || rawGender.toUpperCase() === 'F' || rawGender.toUpperCase() === 'FEMALE') gender = 'F';
          if (name) {
            newList.push({ id: 'p_' + Date.now() + '_' + Math.random().toString(36).substr(2, 5), name: name, gender: gender });
            addedCount++;
          }
        }
        this.list = newList;
        this.render(); MatchingManager.render(); StatsManager.calculateAndRender(); App.saveState();
        Toast.show(`${addedCount}명의 참가자 목록을 파싱 및 저장했습니다!`);
      },
      downloadTemplate() {
        const data = [['이름', '성별 (남/여)'], ['홍길동', '남'], ['성춘향', '여'], ['이몽룡', '남']];
        const ws = XLSX.utils.aoa_to_sheet(data); const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, '참가자양식'); XLSX.writeFile(wb, '테니스대회_참가자_양식.xlsx');
      },
      addParticipant() {
        if (!AdminManager.checkAdmin('참가자 행 추가')) return;
        this.list.push({ id: 'p_' + Date.now() + '_' + Math.random().toString(36).substr(2, 5), name: `선수 ${this.list.length + 1}`, gender: 'M' });
        this.render(); MatchingManager.render(); StatsManager.calculateAndRender(); App.saveState();
      },
      updateParticipant(id, field, value) {
        if (!AdminManager.checkAdmin('참가자 정보 수정')) return;
        const target = this.list.find(p => p.id === id);
        if (target) { target[field] = value; this.updateSummaryPills(); MatchingManager.render(); StatsManager.calculateAndRender(); App.saveState(); }
      },
      deleteParticipant(id) {
        if (!AdminManager.checkAdmin('참가자 삭제')) return;
        this.list = this.list.filter(p => p.id !== id);
        this.render(); MatchingManager.render(); StatsManager.calculateAndRender(); App.saveState();
      },
      clearAll() {
        if (!AdminManager.checkAdmin('참가자 전체 삭제')) return;
        if (confirm('참가자 목록을 전체 삭제하시겠습니까?')) {
          this.list = []; this.render(); MatchingManager.render(); StatsManager.calculateAndRender(); App.saveState(); Toast.show('참가자 목록이 초기화되었습니다.');
        }
      },
      updateSummaryPills() {
        document.getElementById('totalParticipantsCount').textContent = this.list.length;
        document.getElementById('maleParticipantsCount').textContent = this.list.filter(p => p.gender === 'M').length;
        document.getElementById('femaleParticipantsCount').textContent = this.list.filter(p => p.gender === 'F').length;
      },
      render() {
        const tbody = document.getElementById('participantsTableBody'); if (!tbody) return;
        this.updateSummaryPills();
        if (this.list.length === 0) {
          tbody.innerHTML = `<tr><td colspan="4" style="text-align:center; padding:36px; color:var(--text-muted);"><i class="ph ph-user-plus" style="font-size:2.5rem;"></i><p>등록된 참가자가 없습니다. 엑셀 파일을 업로드하거나 [행 추가] 버튼을 눌러주세요.</p></td></tr>`;
          return;
        }
        tbody.innerHTML = this.list.map((p, index) => `
          <tr data-id="${p.id}">
            <td style="width: 80px; text-align: center; color: var(--text-muted);">${index + 1}</td>
            <td><input type="text" value="${p.name}" onchange="ParticipantManager.updateParticipant('${p.id}', 'name', this.value)" ${!AdminManager.isAdmin ? 'readonly' : ''}></td>
            <td style="width: 160px;">
              <select onchange="ParticipantManager.updateParticipant('${p.id}', 'gender', this.value)" ${!AdminManager.isAdmin ? 'disabled' : ''}>
                <option value="M" ${p.gender === 'M' ? 'selected' : ''}>남성 (M)</option>
                <option value="F" ${p.gender === 'F' ? 'selected' : ''}>여성 (F)</option>
              </select>
            </td>
            <td style="width: 100px; text-align: center;">
              <button class="btn btn-danger ${!AdminManager.isAdmin ? 'locked-btn' : ''}" style="padding: 8px 12px;" onclick="ParticipantManager.deleteParticipant('${p.id}')"><i class="ph ph-trash"></i></button>
            </td>
          </tr>
        `).join('');
      }
    };

    const MatchingManager = {
      currentRound: 0, matches: [], pairingHistory: new Set(), absentPlayers: new Set(),
      latecomerBonus: {}, // { playerId: count }
      selectedPlayerForChange: null, // { matchId, team: 'teamA'|'teamB', index: 0|1, playerId, name, gameNumber }
      isMemberChangeModeEnabled: false, // Default OFF mode to prevent accidental player clicks
      isMonthDeleteModeActive: false, // Default OFF mode for month deletion

      init() { this.bindEvents(); },
      bindEvents() {
        document.getElementById('generateSetMatchBtn').addEventListener('click', () => this.generateNextRound());
        document.getElementById('generateSingleMatchBtn').addEventListener('click', () => this.generateSingleMatch());
        document.getElementById('deleteAllMatchesBtn').addEventListener('click', () => this.deleteAllMatches());
        document.getElementById('addMonthBtn').addEventListener('click', () => this.promptAddMonth());
        document.getElementsByName('matchMode').forEach(radio => radio.addEventListener('change', () => App.saveState()));
      },

      /* ➕ / ➖ 지각 경기 수 보정 기능 */
      changeLatecomerBonus(playerId, delta) {
        if (!AdminManager.checkAdmin('지각 경기 수 보정')) return;
        if (!this.latecomerBonus) this.latecomerBonus = {};
        const current = this.latecomerBonus[playerId] || 0;
        const updated = Math.max(0, current + delta);
        if (updated === 0) delete this.latecomerBonus[playerId];
        else this.latecomerBonus[playerId] = updated;
        this.saveCurrentMonthData();
        this.renderParticipantCountsList();
        App.saveState();
        const p = ParticipantManager.list.find(item => item.id === playerId);
        Toast.show(`[${p ? p.name : '선수'}] 지각 보정 경기 수: ${updated > 0 ? '+' + updated : '0'}회`);
      },

      /* 🗑️ 월 삭제 편집 모드 토글 및 개별 월 삭제 */
      toggleMonthDeleteMode() {
        if (!AdminManager.checkAdmin('월 삭제 관리')) return;
        this.isMonthDeleteModeActive = !this.isMonthDeleteModeActive;
        this.renderMonthPills();
        if (this.isMonthDeleteModeActive) {
          Toast.show('월 삭제 모드가 활성화되었습니다. 삭제할 월 옆의 [✕] 버튼을 누르세요.');
        } else {
          Toast.show('월 삭제 편집이 완료되었습니다.');
        }
      },

      deleteSpecificMonth(monthName) {
        if (!AdminManager.checkAdmin('월 삭제')) return;
        if (App.monthList.length <= 1) {
          Toast.show('최소 1개의 월례대회는 유지되어야 합니다.', 'error');
          return;
        }
        if (!confirm(`'${monthName}' 월례대회 데이터와 모든 경기 기록을 삭제하시겠습니까?`)) return;

        delete App.tournaments[monthName];
        App.monthList = App.monthList.filter(m => m !== monthName);
        App.selectedStatsMonths = App.selectedStatsMonths.filter(m => m !== monthName);

        if (App.activeMonth === monthName) {
          App.activeMonth = App.monthList[0];
          this.loadActiveMonthData();
        }

        App.saveState();
        this.render();
        StatsManager.calculateAndRender();
        Toast.show(`'${monthName}' 월례대회가 삭제되었습니다.`);
      },
      saveCurrentMonthData() {
        const active = App.activeMonth; if (!active) return;
        App.tournaments[active] = {
          currentRound: this.currentRound, matches: this.matches, pairingHistory: Array.from(this.pairingHistory),
          absentPlayers: Array.from(this.absentPlayers), latecomerBonus: this.latecomerBonus || {}, matchMode: this.getMatchMode()
        };
      },
      loadActiveMonthData() {
        const active = App.activeMonth;
        this.selectedPlayerForChange = null;
        if (!active || !App.tournaments[active]) {
          this.currentRound = 0; this.matches = []; this.pairingHistory = new Set(); this.absentPlayers = new Set(); this.latecomerBonus = {}; return;
        }
        const t = App.tournaments[active];
        this.currentRound = t.currentRound || 0; this.matches = t.matches || [];
        this.pairingHistory = new Set(t.pairingHistory || []); this.absentPlayers = new Set(t.absentPlayers || []);
        this.latecomerBonus = t.latecomerBonus || {};
        if (t.matchMode) { const radio = document.querySelector(`input[name="matchMode"][value="${t.matchMode}"]`); if (radio) radio.checked = true; }
      },

      /* 🔘 멤버 변경 ON / OFF 모드 토글 기능 */
      toggleMemberChangeMode() {
        if (!AdminManager.checkAdmin('멤버 변경 모드 설정')) return;
        this.isMemberChangeModeEnabled = !this.isMemberChangeModeEnabled;
        if (!this.isMemberChangeModeEnabled) {
          this.selectedPlayerForChange = null;
        }
        this.render();
        if (this.isMemberChangeModeEnabled) {
          Toast.show('개별 멤버 변경: ON');
        } else {
          Toast.show('개별 멤버 변경: OFF');
        }
      },

      /* 🔄 개별 멤버 선택 / 취소 / 교체 기능 */
      selectPlayerForChange(matchId, team, index, playerId) {
        if (!AdminManager.checkAdmin('개별 멤버 변경')) return;
        if (!this.isMemberChangeModeEnabled) {
          Toast.show('🔒 개별 멤버 변경 모드가 OFF 상태입니다. 오른쪽 상단 [개별 멤버 변경: ON] 스위치를 켜세요.', 'error');
          return;
        }
        const player = ParticipantManager.list.find(p => p.id === playerId);
        const match = this.matches.find(m => m.id === matchId);
        if (!player || !match) return;

        // 이미 1명의 선수가 선택된 상태에서 다른 선수를 누른 경우 -> 두 선수를 즉시 스왑 교체!
        if (this.selectedPlayerForChange) {
          if (this.selectedPlayerForChange.matchId === matchId &&
              this.selectedPlayerForChange.team === team &&
              this.selectedPlayerForChange.index === index) {
            this.cancelPlayerSelection();
            return;
          }
          this.executePlayerReplacement(playerId, matchId, team, index);
          return;
        }

        const gameNum = match.gameNumber || 1;
        this.selectedPlayerForChange = {
          matchId, team, index, playerId,
          name: player.name, gameNumber: gameNum
        };
        this.render();
        Toast.show(`[${gameNum}GAME ${team === 'teamA' ? '팀A' : '팀B'}] ${player.name} 선수가 선택되었습니다. 교체할 상대(다른 대진표 선수 또는 좌측 참가자)를 클릭하세요.`);
      },

      cancelPlayerSelection() {
        this.selectedPlayerForChange = null;
        this.render();
      },

      executePlayerReplacement(targetPlayerId, targetMatchId = null, targetTeam = null, targetIndex = -1) {
        if (!AdminManager.checkAdmin('개별 멤버 변경')) return;
        if (!this.isMemberChangeModeEnabled) {
          Toast.show('🔒 개별 멤버 변경 모드가 OFF 상태입니다.', 'error');
          return;
        }
        if (!this.selectedPlayerForChange) return;

        const sel = this.selectedPlayerForChange;
        const matchA = this.matches.find(m => m.id === sel.matchId);
        if (!matchA) { this.cancelPlayerSelection(); return; }

        const oldPlayer = ParticipantManager.list.find(p => p.id === sel.playerId);
        const newPlayer = ParticipantManager.list.find(p => p.id === targetPlayerId);

        if (!newPlayer) { Toast.show('대상 선수를 찾을 수 없습니다.', 'error'); return; }

        if (targetMatchId) {
          // 대진표 카드 내부의 선수를 직접 클릭하여 스왑하는 경우
          const matchB = this.matches.find(m => m.id === targetMatchId);
          if (matchB) {
            matchA[sel.team][sel.index] = targetPlayerId;
            matchB[targetTeam][targetIndex] = sel.playerId;
            Toast.show(`[${sel.gameNumber}GAME ${oldPlayer ? oldPlayer.name : '선수'}] ↔ [${matchB.gameNumber}GAME ${newPlayer.name}] 자리가 성공적으로 스왑 교체되었습니다!`);
          }
        } else {
          // 좌측 참가자 목록에서 클릭한 경우
          let isSameMatchSwap = false;
          let swapTeam = null, swapIndex = -1;

          if (matchA.teamA.includes(targetPlayerId)) {
            isSameMatchSwap = true;
            swapTeam = 'teamA';
            swapIndex = matchA.teamA.indexOf(targetPlayerId);
          } else if (matchA.teamB.includes(targetPlayerId)) {
            isSameMatchSwap = true;
            swapTeam = 'teamB';
            swapIndex = matchA.teamB.indexOf(targetPlayerId);
          }

          if (isSameMatchSwap) {
            matchA[sel.team][sel.index] = targetPlayerId;
            matchA[swapTeam][swapIndex] = sel.playerId;
            Toast.show(`${sel.gameNumber}GAME 내에서 [${oldPlayer ? oldPlayer.name : '선수'}] ↔ [${newPlayer.name}] 자리가 스왑되었습니다!`);
          } else {
            matchA[sel.team][sel.index] = targetPlayerId;
            Toast.show(`${sel.gameNumber}GAME의 [${oldPlayer ? oldPlayer.name : '선수'}] 선수가 [${newPlayer.name}] 선수로 교체되었습니다!`);
          }
        }

        // 대진 이력 및 기록 전체 재계산/연동
        this.pairingHistory.clear();
        this.matches.forEach(m => {
          if (m.teamA[0] && m.teamA[1]) this.savePair(m.teamA[0], m.teamA[1]);
          if (m.teamB[0] && m.teamB[1]) this.savePair(m.teamB[0], m.teamB[1]);
        });

        this.selectedPlayerForChange = null;
        this.render();
        StatsManager.calculateAndRender();
        App.saveState();
      },

      toggleAbsent(participantId, isAbsent) {
        if (!AdminManager.checkAdmin('참석/불참 지정')) return;
        if (isAbsent) this.absentPlayers.add(participantId); else this.absentPlayers.delete(participantId);
        this.saveCurrentMonthData(); this.renderParticipantCountsList(); App.saveState();
      },
      deleteSingleMatch(matchId) {
        if (!AdminManager.checkAdmin('경기 삭제')) return;
        const targetIndex = this.matches.findIndex(m => m.id === matchId); if (targetIndex === -1) return;
        const gameNumStr = this.matches[targetIndex].gameNumber || (targetIndex + 1);
        if (confirm(`${gameNumStr}GAME 경기를 삭제하시겠습니까?`)) {
          if (this.selectedPlayerForChange && this.selectedPlayerForChange.matchId === matchId) {
            this.selectedPlayerForChange = null;
          }
          this.matches.splice(targetIndex, 1);
          this.matches.forEach((m, idx) => { m.gameNumber = idx + 1; });
          this.currentRound = this.matches.length === 0 ? 0 : Math.max(...this.matches.map(m => m.round || 1));
          this.render(); StatsManager.calculateAndRender(); App.saveState(); Toast.show(`${gameNumStr}GAME 경기가 삭제되었습니다.`);
        }
      },
      deleteAllMatches() {
        if (!AdminManager.checkAdmin('전체 경기 삭제')) return;
        const active = App.activeMonth; if (this.matches.length === 0) { Toast.show('삭제할 경기가 없습니다.', 'error'); return; }
        if (confirm(`${active} 대회의 모든 경기를 삭제하시겠습니까?`)) {
          this.selectedPlayerForChange = null;
          this.matches = []; this.currentRound = 0; this.pairingHistory.clear();
          this.render(); StatsManager.calculateAndRender(); App.saveState(); Toast.show(`${active} 대회의 모든 경기가 삭제되었습니다.`);
        }
      },
      promptAddMonth() {
        if (!AdminManager.checkAdmin('월례대회 추가')) return;
        const monthsAvailable = ['1월', '2월', '3월', '4월', '5월', '6월', '7월', '8월', '9월', '10월', '11월', '12월'];
        const unadded = monthsAvailable.filter(m => !App.monthList.includes(m));
        if (unadded.length === 0) { Toast.show('모든 월례대회가 이미 생성되어 있습니다.', 'error'); return; }
        const monthStr = prompt(`추가할 월을 입력하세요 (${unadded.join(', ')}):`, unadded[0]); if (!monthStr) return;
        const formatted = monthStr.trim().endsWith('월') ? monthStr.trim() : monthStr.trim() + '월';
        if (App.monthList.includes(formatted)) { Toast.show(`이미 ${formatted} 대회가 존재합니다.`, 'error'); return; }
        this.saveCurrentMonthData(); App.monthList.push(formatted); App.monthList.sort((a, b) => parseInt(a) - parseInt(b));
        App.tournaments[formatted] = { currentRound: 0, matches: [], pairingHistory: [], absentPlayers: [], matchMode: 'regular' };
        if (!App.selectedStatsMonths.includes(formatted)) App.selectedStatsMonths.push(formatted);
        this.switchMonth(formatted); Toast.show(`${formatted} 대회가 생성되었습니다.`);
      },
      switchMonth(monthName) {
        if (!App.monthList.includes(monthName)) return;
        this.saveCurrentMonthData(); App.activeMonth = monthName; this.loadActiveMonthData();
        this.render(); StatsManager.calculateAndRender(); App.saveState();
      },
      deleteCurrentMonth() {
        if (!AdminManager.checkAdmin('월례대회 삭제')) return;
        const active = App.activeMonth; if (App.monthList.length <= 1) { Toast.show('최소 1개의 월례대회는 유지되어야 합니다.', 'error'); return; }
        if (confirm(`${active} 대회를 삭제하시겠습니까?`)) {
          this.selectedPlayerForChange = null;
          delete App.tournaments[active]; App.monthList = App.monthList.filter(m => m !== active);
          App.selectedStatsMonths = App.selectedStatsMonths.filter(m => m !== active); App.activeMonth = App.monthList[0];
          this.loadActiveMonthData(); this.render(); StatsManager.calculateAndRender(); App.saveState(); Toast.show(`${active} 대회가 삭제되었습니다.`);
        }
      },
      getMatchMode() { const checked = document.querySelector('input[name="matchMode"]:checked'); return checked ? checked.value : 'regular'; },
      getRawPlayedCounts() {
        const counts = {}; ParticipantManager.list.forEach(p => counts[p.id] = 0);
        this.matches.forEach(m => { [...m.teamA, ...m.teamB].forEach(pId => { if (counts[pId] !== undefined) counts[pId]++; }); });
        return counts;
      },
      getPlayedCounts() {
        const counts = {}; ParticipantManager.list.forEach(p => counts[p.id] = (this.latecomerBonus && this.latecomerBonus[p.id]) || 0);
        this.matches.forEach(m => { [...m.teamA, ...m.teamB].forEach(pId => { if (counts[pId] !== undefined) counts[pId]++; }); });
        return counts;
      },

      /* ⚡ 정확히 1GAME만 단일 생성하는 모듈 */
      generateSingleMatch() {
        if (!AdminManager.checkAdmin('1GAME 생성')) return;
        const activeParticipants = ParticipantManager.list.filter(p => !this.absentPlayers.has(p.id));
        if (activeParticipants.length < 4) { Toast.show('참석 인원이 최소 4명 이상이어야 합니다.', 'error'); return; }
        const mode = this.getMatchMode(); const playedCounts = this.getPlayedCounts();
        if (mode === 'mixed') {
          const males = activeParticipants.filter(p => p.gender === 'M');
          const females = activeParticipants.filter(p => p.gender === 'F');
          if (males.length < 2 || females.length < 2) { Toast.show('혼합 복식에는 참석 남성 2명, 여성 2명이 필요합니다.', 'error'); return; }
        }

        const sortedActive = [...activeParticipants].sort((a, b) => {
          const diff = (playedCounts[a.id] || 0) - (playedCounts[b.id] || 0);
          return diff !== 0 ? diff : (Math.random() - 0.5);
        });

        const matchTeams = mode === 'mixed'
          ? this.findMixedMatch(sortedActive, playedCounts)
          : this.findRegularMatch(sortedActive, playedCounts);

        if (!matchTeams) { Toast.show('생성 가능한 경기가 없습니다.', 'error'); return; }

        const nextGameNum = this.matches.length + 1;
        const targetRound = this.currentRound === 0 ? 1 : Math.max(this.currentRound, Math.floor((nextGameNum - 1) / 3) + 1);

        const matchObj = {
          id: 'm_' + Date.now() + '_' + Math.random().toString(36).substr(2, 5),
          round: targetRound,
          gameNumber: nextGameNum,
          mode: mode,
          typeLabel: matchTeams.typeLabel || (mode === 'mixed' ? '혼복' : '복식'),
          teamA: matchTeams.teamA,
          teamB: matchTeams.teamB,
          scoreA: '',
          scoreB: ''
        };

        this.matches.push(matchObj);
        this.savePair(matchTeams.teamA[0], matchTeams.teamA[1]);
        this.savePair(matchTeams.teamB[0], matchTeams.teamB[1]);
        this.currentRound = Math.max(this.currentRound, targetRound);

        this.render();
        StatsManager.calculateAndRender();
        App.saveState();
        Toast.show(`${App.activeMonth} 1GAME (${matchTeams.typeLabel})가 추가 생성되었습니다!`);
      },

      /* 🎾 1세트(라운드) 전체 매칭 생성 모듈 */
      generateNextRound() {
        if (!AdminManager.checkAdmin('1세트 매칭 생성')) return;
        const activeParticipants = ParticipantManager.list.filter(p => !this.absentPlayers.has(p.id));
        if (activeParticipants.length < 4) { Toast.show('참석 인원이 최소 4명 이상이어야 합니다.', 'error'); return; }
        const mode = this.getMatchMode(); const targetRound = this.currentRound + 1; const playedCounts = this.getPlayedCounts();
        if (mode === 'mixed') {
          const males = activeParticipants.filter(p => p.gender === 'M'); const females = activeParticipants.filter(p => p.gender === 'F');
          if (males.length < 2 || females.length < 2) { Toast.show('혼합 복식에는 참석 남성 2명, 여성 2명이 필요합니다.', 'error'); return; }
        }
        const roundMatches = this.createMatchesForRound(targetRound, mode, playedCounts, activeParticipants);
        if (roundMatches.length === 0) { Toast.show('생성 가능한 경기가 없습니다.', 'error'); return; }
        this.currentRound = targetRound; this.matches.push(...roundMatches);
        roundMatches.forEach(m => { this.savePair(m.teamA[0], m.teamA[1]); this.savePair(m.teamB[0], m.teamB[1]); });
        this.render(); StatsManager.calculateAndRender(); App.saveState(); Toast.show(`${App.activeMonth} ${roundMatches.length}개 경기가 생성되었습니다!`);
      },
      savePair(p1, p2) { if (!p1 || !p2) return; this.pairingHistory.add(`${p1}_${p2}`); this.pairingHistory.add(`${p2}_${p1}`); },
      hasPaired(p1, p2) { return this.pairingHistory.has(`${p1}_${p2}`); },
      createMatchesForRound(targetRound, mode, currentCounts, activeParticipants) {
        const created = []; const tempCounts = { ...currentCounts }; let nextGameNum = this.matches.length + 1;
        while (true) {
          const eligible = activeParticipants.filter(p => tempCounts[p.id] < targetRound);
          if (eligible.length < 4) break;
          let matchTeams = mode === 'mixed' ? this.findMixedMatch(eligible, tempCounts) : this.findRegularMatch(eligible, tempCounts);
          if (!matchTeams) break;
          const matchObj = {
            id: 'm_' + Date.now() + '_' + Math.random().toString(36).substr(2, 5), round: targetRound, gameNumber: nextGameNum++, mode: mode,
            typeLabel: matchTeams.typeLabel || (mode === 'mixed' ? '혼복' : '복식'),
            teamA: matchTeams.teamA, teamB: matchTeams.teamB, scoreA: '', scoreB: ''
          };
          created.push(matchObj); [...matchTeams.teamA, ...matchTeams.teamB].forEach(id => { tempCounts[id]++; });
        }
        created.sort(() => Math.random() - 0.5);
        created.forEach((m, idx) => { m.gameNumber = (this.matches.length + idx + 1); });
        return created;
      },
      findRegularMatch(eligiblePlayers, counts) {
        const lastMatch = this.matches.length > 0 ? this.matches[this.matches.length - 1] : null;
        const recentPlayedIds = new Set(lastMatch ? [...(lastMatch.teamA || []), ...(lastMatch.teamB || [])].filter(Boolean) : []);

        let males = eligiblePlayers.filter(p => p.gender === 'M');
        let females = eligiblePlayers.filter(p => p.gender === 'F');

        const restMales = males.filter(p => !recentPlayedIds.has(p.id));
        const restFemales = females.filter(p => !recentPlayedIds.has(p.id));

        const eligibleMales = (restMales.length >= 4 ? restMales : males).sort((a, b) => (counts[a.id] - counts[b.id]) || (Math.random() - 0.5));
        const eligibleFemales = (restFemales.length >= 4 ? restFemales : females).sort((a, b) => (counts[a.id] - counts[b.id]) || (Math.random() - 0.5));

        const canMale = eligibleMales.length >= 4, canFemale = eligibleFemales.length >= 4;
        if (!canMale && !canFemale) return null;
        let selectedGroup = null; let typeLabel = '남복';
        if (canMale && canFemale) {
          const mScore = eligibleMales.slice(0, 4).reduce((sum, p) => sum + counts[p.id], 0);
          const fScore = eligibleFemales.slice(0, 4).reduce((sum, p) => sum + counts[p.id], 0);
          const pickMale = (mScore + (Math.random() * 0.5)) <= (fScore + (Math.random() * 0.5));
          selectedGroup = pickMale ? eligibleMales : eligibleFemales;
          typeLabel = pickMale ? '남복' : '여복';
        } else {
          selectedGroup = canMale ? eligibleMales : eligibleFemales;
          typeLabel = canMale ? '남복' : '여복';
        }
        const selected = selectedGroup.slice(0, 4); const [p1, p2, p3, p4] = selected.map(p => p.id);
        const pairings = [ { teamA: [p1, p2], teamB: [p3, p4] }, { teamA: [p1, p3], teamB: [p2, p4] }, { teamA: [p1, p4], teamB: [p2, p3] } ];
        pairings.sort((pairX, pairY) => {
          const penX = (this.hasPaired(pairX.teamA[0], pairX.teamA[1]) ? 10 : 0) + (this.hasPaired(pairX.teamB[0], pairX.teamB[1]) ? 10 : 0);
          const penY = (this.hasPaired(pairY.teamA[0], pairY.teamA[1]) ? 10 : 0) + (this.hasPaired(pairY.teamB[0], pairY.teamB[1]) ? 10 : 0);
          return (penX + Math.random()) - (penY + Math.random());
        });
        const result = pairings[0]; result.typeLabel = typeLabel;
        return result;
      },
      findMixedMatch(eligiblePlayers, counts) {
        const lastMatch = this.matches.length > 0 ? this.matches[this.matches.length - 1] : null;
        const recentPlayedIds = new Set(lastMatch ? [...(lastMatch.teamA || []), ...(lastMatch.teamB || [])].filter(Boolean) : []);

        let males = eligiblePlayers.filter(p => p.gender === 'M');
        let females = eligiblePlayers.filter(p => p.gender === 'F');

        const restMales = males.filter(p => !recentPlayedIds.has(p.id));
        const restFemales = females.filter(p => !recentPlayedIds.has(p.id));

        const eligibleMales = (restMales.length >= 2 ? restMales : males).sort((a, b) => (counts[a.id] - counts[b.id]) || (Math.random() - 0.5));
        const eligibleFemales = (restFemales.length >= 2 ? restFemales : females).sort((a, b) => (counts[a.id] - counts[b.id]) || (Math.random() - 0.5));

        if (eligibleMales.length < 2 || eligibleFemales.length < 2) return null;
        const m1 = eligibleMales[0].id, m2 = eligibleMales[1].id, f1 = eligibleFemales[0].id, f2 = eligibleFemales[1].id;
        const option1 = { teamA: [m1, f1], teamB: [m2, f2] }, option2 = { teamA: [m1, f2], teamB: [m2, f1] };
        const pen1 = (this.hasPaired(m1, f1) ? 10 : 0) + (this.hasPaired(m2, f2) ? 10 : 0);
        const pen2 = (this.hasPaired(m1, f2) ? 10 : 0) + (this.hasPaired(m2, f1) ? 10 : 0);
        const result = pen1 <= pen2 ? option1 : option2;
        result.typeLabel = '혼복';
        return result;
      },
      /* 🎾 스코어 입력: 관리자만 입력 가능 */
      handleScoreChange(matchId, scoreAVal, scoreBVal) {
        if (!AdminManager.checkAdmin('점수 입력')) return;
        const match = this.matches.find(m => m.id === matchId); if (!match) return;
        match.scoreA = scoreAVal; match.scoreB = scoreBVal;
        this.updateCardState(matchId); StatsManager.calculateAndRender(); App.saveState();
      },
      lockScore(matchId) {
        const match = this.matches.find(m => m.id === matchId); if (!match) return;
        const sA = parseInt(match.scoreA, 10), sB = parseInt(match.scoreB, 10);
        if (isNaN(sA) || isNaN(sB)) {
          Toast.show('팀 A와 팀 B의 점수를 모두 입력한 후 [완료]를 누르세요.', 'error');
          return;
        }
        match.isScoreLocked = true;
        this.render();
        StatsManager.calculateAndRender();
        App.saveState();
        Toast.show(`${match.gameNumber || 1}GAME 경기 점수 입력이 완료되어 잠겼습니다.`);
      },
      unlockScore(matchId) {
        if (!AdminManager.checkAdmin('점수 잠금 해제')) return;
        const match = this.matches.find(m => m.id === matchId); if (!match) return;
        match.isScoreLocked = false;
        this.render();
        StatsManager.calculateAndRender();
        App.saveState();
        Toast.show(`${match.gameNumber || 1}GAME 점수 잠금이 해제되었습니다.`);

      removePlayerFromMatch(matchId, teamKey, pIdx) {
        if (!AdminManager.checkAdmin('선수 삭제')) return;
        const match = this.matches.find(m => m.id === matchId); if (!match) return;
        match[teamKey][pIdx] = null;
        this.render(); StatsManager.calculateAndRender(); App.saveState();
        Toast.show(`선수가 경기에서 제외되었습니다. [+ 선수선택]을 누르면 언제든 배치 가능합니다.`);
      },
      setPlayerForMatchSlot(matchId, teamKey, pIdx, newPlayerId) {
        if (!AdminManager.checkAdmin('선수 선택')) return;
        const match = this.matches.find(m => m.id === matchId); if (!match) return;
        if (!newPlayerId) return;
        match[teamKey][pIdx] = newPlayerId;
        if (match.teamA[0] && match.teamA[1]) this.savePair(match.teamA[0], match.teamA[1]);
        if (match.teamB[0] && match.teamB[1]) this.savePair(match.teamB[0], match.teamB[1]);
        this.render(); StatsManager.calculateAndRender(); App.saveState();
        const p = ParticipantManager.list.find(item => item.id === newPlayerId);
        Toast.show(`[${p ? p.name : '선수'}] (이)가 대진표에 배치되었습니다.`);
      },
      toggleStatsExclusion(matchId, playerId) {
        if (!AdminManager.checkAdmin('통계 기록 제외/포함 설정')) return;
        const match = this.matches.find(m => m.id === matchId); if (!match) return;
        if (!match.excludedStatsPlayers) match.excludedStatsPlayers = [];
        const idx = match.excludedStatsPlayers.indexOf(playerId);
        if (idx > -1) {
          match.excludedStatsPlayers.splice(idx, 1);
        } else {
          match.excludedStatsPlayers.push(playerId);
        }
        this.render(); StatsManager.calculateAndRender(); App.saveState();
        const p = ParticipantManager.list.find(item => item.id === playerId);
        const isNowEx = match.excludedStatsPlayers.includes(playerId);
        Toast.show(`[${p ? p.name : '선수'}] 통계 기록: ${isNowEx ? '🚫 미반영(제외됨)' : '📊 정상 반영'}`);
      },
      updateCardState(matchId) {
        const card = document.querySelector(`.match-card[data-id="${matchId}"]`); if (!card) return;
        const match = this.matches.find(m => m.id === matchId); if (!match) return;
        const sA = parseInt(match.scoreA, 10), sB = parseInt(match.scoreB, 10), isValid = !isNaN(sA) && !isNaN(sB);
        const teamABox = card.querySelector('.team-box-a'), teamBBox = card.querySelector('.team-box-b'), statusBadge = card.querySelector('.match-status');
        if (isValid) {
          statusBadge.textContent = '경기 완료'; statusBadge.className = 'match-status status-completed';
          if (sA > sB) { teamABox.classList.add('winner'); teamBBox.classList.remove('winner'); }
          else if (sB > sA) { teamBBox.classList.add('winner'); teamABox.classList.remove('winner'); }
          else { teamABox.classList.remove('winner'); teamBBox.classList.remove('winner'); }
        } else {
          statusBadge.textContent = '진행 예정'; statusBadge.className = 'match-status';
          teamABox.classList.remove('winner'); teamBBox.classList.remove('winner');
        }
      },
