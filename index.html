            </div>`;
          }).join('');

          const sA = parseInt(m.scoreA, 10), sB = parseInt(m.scoreB, 10), isCompleted = !isNaN(sA) && !isNaN(sB);
          const winnerA = isCompleted && sA > sB ? 'winner' : '', winnerB = isCompleted && sB > sA ? 'winner' : '';

          const isScoreDisabled = !AdminManager.isAdmin || m.isScoreLocked;

          let lockBtnHtml = '';
          if (AdminManager.isAdmin) {
            if (m.isScoreLocked) {
              lockBtnHtml = `<button class="btn btn-secondary btn-sm" onclick="MatchingManager.unlockScore('${m.id}')" title="관리자: 점수 수정 잠금 해제"><i class="ph ph-lock-key-open"></i> 수정 해제</button>`;
            } else {
              lockBtnHtml = `<button class="btn btn-yellow btn-sm btn-lock-score" onclick="MatchingManager.lockScore('${m.id}')" title="점수 입력 완료 및 수정 잠금"><i class="ph ph-check"></i> 완료</button>`;
            }
          } else {
            if (m.isScoreLocked) {
              lockBtnHtml = `<span class="badge-score-locked"><i class="ph ph-lock-key"></i> 완료됨</span>`;
            }
          }

          return `
            <div class="match-card" data-id="${m.id}">
              <div class="match-card-header">
                <span class="game-title">
                  <i class="ph ph-trophy"></i> ${gameNum}GAME 
                  <span class="game-type-badge">${matchTypeStr}</span>
                </span>
                <div class="match-card-actions">
                  <span class="match-status ${isCompleted ? 'status-completed' : ''}">${isCompleted ? '경기 완료' : '진행 예정'}</span>
                  <button class="btn-card-delete ${!AdminManager.isAdmin ? 'locked-btn' : ''}" onclick="MatchingManager.deleteSingleMatch('${m.id}')" title="이 경기 삭제"><i class="ph ph-trash"></i> 삭제</button>
                </div>
              </div>
              <div class="teams-container">
                <div class="team-box team-box-a ${winnerA}">
                  <div class="team-name">팀 A ${winnerA ? '👑 WIN' : ''}</div>
                  <div class="team-players">${getPlayerNames(m.teamA, 'teamA')}</div>
                </div>
                <div class="vs-badge">VS</div>
                <div class="team-box team-box-b ${winnerB}">
                  <div class="team-name">팀 B ${winnerB ? '👑 WIN' : ''}</div>
                  <div class="team-players">${getPlayerNames(m.teamB, 'teamB')}</div>
                </div>
              </div>
              <div class="score-controller">
                <input type="number" min="0" max="99" class="score-input" value="${m.scoreA}" placeholder="0" oninput="MatchingManager.handleScoreChange('${m.id}', this.value, this.nextElementSibling.nextElementSibling.value)" ${isScoreDisabled ? 'readonly disabled style="opacity:0.85; cursor:not-allowed;" title="🔒 스코어 입력은 관리자 전용 기능입니다."' : ''}>
                <span class="score-divider">:</span>
                <input type="number" min="0" max="99" class="score-input" value="${m.scoreB}" placeholder="0" oninput="MatchingManager.handleScoreChange('${m.id}', this.previousElementSibling.previousElementSibling.value, this.value)" ${isScoreDisabled ? 'readonly disabled style="opacity:0.85; cursor:not-allowed;" title="🔒 스코어 입력은 관리자 전용 기능입니다."' : ''}>
                ${lockBtnHtml}
              </div>
            </div>
          `;
        }).join('');

        roundListContainer.innerHTML = `<div class="matches-single-column-list">${matchesHtml}</div>`;
      }
    };

    const StatsManager = {
      sortKey: 'winRate', sortOrder: 'desc',
      init() { this.bindEvents(); },
      bindEvents() {
        const exportExcelBtn = document.getElementById('exportExcelStatsBtn');
        const exportJsonBtn = document.getElementById('exportJsonDataBtn');
        const importJsonInput = document.getElementById('importJsonFileInput');
        if (exportExcelBtn) exportExcelBtn.addEventListener('click', () => this.exportToExcel());
        if (exportJsonBtn) exportJsonBtn.addEventListener('click', () => App.exportJsonBackup());
        if (importJsonInput) importJsonInput.addEventListener('change', (e) => App.importJsonBackup(e.target.files[0]));
      },
      exportToPDF() {
        const printMeta = document.getElementById('printMetaInfo');
        if (printMeta) {
          const selectedMonthsStr = App.selectedStatsMonths.join(', ');
          const now = new Date();
          const dateStr = `${now.getFullYear()}.${String(now.getMonth() + 1).padStart(2, '0')}.${String(now.getDate()).padStart(2, '0')}`;
          printMeta.textContent = `조회 대회: ${selectedMonthsStr || '전체'} | 출력일자: ${dateStr}`;
        }
        window.print();
      },
      setSort(key) {
        if (this.sortKey === key) this.sortOrder = this.sortOrder === 'asc' ? 'desc' : 'asc';
        else { this.sortKey = key; this.sortOrder = 'desc'; }
        this.calculateAndRender();
      },
      renderMonthCheckboxes() {
        const container = document.getElementById('statsMonthCheckboxes'); if (!container) return;
        if (!App.monthList || App.monthList.length === 0) { container.innerHTML = `<span style="color: var(--text-muted); font-size: 1.1rem;">등록된 월례대회가 없습니다.</span>`; return; }
        container.innerHTML = App.monthList.map(m => {
          const isChecked = App.selectedStatsMonths.includes(m);
          return `
            <label class="month-checkbox-item">
              <input type="checkbox" value="${m}" ${isChecked ? 'checked' : ''} onchange="StatsManager.toggleMonthFilter('${m}', this.checked)">
              <span>${m}</span>
            </label>
          `;
        }).join('');
      },
      toggleMonthFilter(monthName, isChecked) {
        if (isChecked) { if (!App.selectedStatsMonths.includes(monthName)) App.selectedStatsMonths.push(monthName); }
        else { App.selectedStatsMonths = App.selectedStatsMonths.filter(m => m !== monthName); }
        this.calculateAndRender();
      },
      calculateStats() {
        const statsMap = {};
        ParticipantManager.list.forEach(p => {
          statsMap[p.id] = { id: p.id, name: p.name, gender: p.gender, played: 0, wins: 0, losses: 0, winRate: 0, ptsWon: 0, ptsLost: 0, ptsDiff: 0 };
        });
        if (!App.selectedStatsMonths || App.selectedStatsMonths.length === 0) {
          App.selectedStatsMonths = App.monthList.length > 0 ? [App.monthList[App.monthList.length - 1]] : [...App.monthList];
        }
        App.selectedStatsMonths.forEach(mName => {
          const tournament = App.tournaments[mName]; if (!tournament || !tournament.matches) return;
          tournament.matches.forEach(m => {
            const sA = parseInt(m.scoreA, 10), sB = parseInt(m.scoreB, 10);
            const excluded = m.excludedStatsPlayers || [];
            if (!isNaN(sA) && !isNaN(sB)) {
              m.teamA.forEach(id => { if (id && statsMap[id] && !excluded.includes(id)) { statsMap[id].played += 1; statsMap[id].ptsWon += sA; statsMap[id].ptsLost += sB; if (sA > sB) statsMap[id].wins += 1; else if (sB > sA) statsMap[id].losses += 1; } });
              m.teamB.forEach(id => { if (id && statsMap[id] && !excluded.includes(id)) { statsMap[id].played += 1; statsMap[id].ptsWon += sB; statsMap[id].ptsLost += sA; if (sB > sA) statsMap[id].wins += 1; else if (sA > sB) statsMap[id].losses += 1; } });
            }
          });
        });
        const resultList = Object.values(statsMap).map(st => {
          st.winRate = st.played > 0 ? (st.wins / st.played) * 100 : 0;
          st.ptsDiff = st.ptsWon - st.ptsLost; return st;
        });
        resultList.sort((a, b) => {
          let valA = a[this.sortKey], valB = b[this.sortKey];
          if (valA === valB) {
            if (this.sortKey !== 'winRate') { valA = a.winRate; valB = b.winRate; }
            if (valA === valB) { valA = a.ptsDiff; valB = b.ptsDiff; }
          }
          if (typeof valA === 'string') return this.sortOrder === 'asc' ? valA.localeCompare(valB) : valB.localeCompare(valA);
          return this.sortOrder === 'asc' ? valA - valB : valB - valA;
        });
        return resultList;
      },
      calculateAndRender() {
        this.renderMonthCheckboxes();
        const ths = document.querySelectorAll('#statsTable th');
        ths.forEach(th => {
          th.classList.add('sortable');
          th.title = '클릭하여 오름차순/내림차순 정렬';
        });
        const tbody = document.getElementById('statsTableBody'); if (!tbody) return;
        const stats = this.calculateStats();
        if (stats.length === 0) { tbody.innerHTML = `<tr><td colspan="10" class="empty-state"><i class="ph ph-chart-bar"></i><p>등록된 참가자가 없습니다.</p></td></tr>`; return; }
        tbody.innerHTML = stats.map((st, index) => {
          let rankBadgeClass = 'rank-badge';
          if (index === 0) rankBadgeClass += ' rank-1'; else if (index === 1) rankBadgeClass += ' rank-2'; else if (index === 2) rankBadgeClass += ' rank-3';
          const genderBadge = st.gender === 'F' ? '<span class="badge-f">(여)</span>' : '<span class="badge-m">(남)</span>';
          let diffClass = 'diff-zero', diffSign = '';
          if (st.ptsDiff > 0) { diffClass = 'diff-positive'; diffSign = '+'; } else if (st.ptsDiff < 0) { diffClass = 'diff-negative'; }
          return `
            <tr>
              <td style="text-align: center;"><span class="${rankBadgeClass}">${index + 1}</span></td>
              <td><strong>${st.name}</strong> ${genderBadge}</td>
              <td style="text-align: center; font-weight: 800;">${st.played}</td>
              <td style="text-align: center; color: var(--vivid-yellow); font-weight: 800;">${st.wins}</td>
              <td style="text-align: center; color: var(--text-muted);">${st.losses}</td>
              <td style="text-align: center; font-weight: 800;">${st.winRate.toFixed(1)}%</td>
              <td style="text-align: center;">${st.ptsWon}</td>
              <td style="text-align: center; color: var(--text-muted);">${st.ptsLost}</td>
              <td style="text-align: center;" class="${diffClass}">${diffSign}${st.ptsDiff}</td>
            </tr>
          `;
        }).join('');
      },
      exportToExcel() {
        const stats = this.calculateStats(); if (stats.length === 0) { Toast.show('내보낼 통계 데이터가 없습니다.', 'error'); return; }
        const excelData = stats.map((st, index) => ({
          '순위': index + 1, '이름': st.name, '성별': st.gender === 'M' ? '남성' : '여성',
          '총 경기 수': st.played, '승': st.wins, '패': st.losses, '승률 (%)': Number(st.winRate.toFixed(1)),
          '총 득점': st.ptsWon, '총 실점': st.ptsLost, '득실차': st.ptsDiff
        }));
        const ws = XLSX.utils.json_to_sheet(excelData); const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, '대회통계');
        const selectedMonthsStr = App.selectedStatsMonths.join('_');
        XLSX.writeFile(wb, `테니스월례대회_통계_${selectedMonthsStr}.xlsx`);
        Toast.show(`선택한 월례대회(${selectedMonthsStr})의 통계 엑셀 파일이 다운로드되었습니다.`);
      }
    };

    const App = {
      STORAGE_KEY: 'BEST_TENNIS_CLUB_DATA_V2',
      activeMonth: '3월', monthList: ['3월'],
      tournaments: { '3월': { currentRound: 0, matches: [], pairingHistory: [], absentPlayers: [], matchMode: 'regular' } },
      selectedStatsMonths: ['3월'],

      init() {
        this.bindNavigation();
        AdminManager.init();
        ParticipantManager.init(); MatchingManager.init(); StatsManager.init();
        this.loadStateFromCloudOrLocal();
      },

      bindNavigation() {
        document.querySelectorAll('.tab-btn').forEach(btn => {
          btn.addEventListener('click', () => {
            const targetTab = btn.dataset.tab;
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('.tab-pane').forEach(p => p.classList.remove('active'));
            btn.classList.add('active');
            const targetPane = document.getElementById(targetTab);
            if (targetPane) targetPane.classList.add('active');
            if (targetTab === 'tab-matching') MatchingManager.render();
            else if (targetTab === 'tab-stats') StatsManager.calculateAndRender();
          });
        });
      },

      loadStateFromCloudOrLocal() {
        if (typeof google !== 'undefined' && google.script && google.script.run) {
          google.script.run.withSuccessHandler(cloudData => {
            if (cloudData) { this.applyLoadedData(cloudData); } else { this.loadStateFromLocalStorage(); }
            this.renderAllViews();
          }).getCloudData();
        } else {
          this.loadStateFromLocalStorage();
          this.renderAllViews();
        }
      },

      loadStateFromLocalStorage() {
        try {
          const raw = localStorage.getItem(this.STORAGE_KEY); if (!raw) return;
          const data = JSON.parse(raw); this.applyLoadedData(data);
        } catch (e) { console.error('LocalStorage load error:', e); }
      },

      applyLoadedData(data) {
        if (data.participants) ParticipantManager.list = data.participants;
        if (data.monthList && data.monthList.length > 0) this.monthList = data.monthList;
        if (data.activeMonth && this.monthList.includes(data.activeMonth)) this.activeMonth = data.activeMonth;
        else if (this.monthList.length > 0) this.activeMonth = this.monthList[0];
        if (data.tournaments) this.tournaments = data.tournaments;
        if (this.monthList && this.monthList.length > 0) {
          this.selectedStatsMonths = [this.monthList[this.monthList.length - 1]];
        } else {
          this.selectedStatsMonths = [];
        }
        MatchingManager.loadActiveMonthData();
      },

      renderAllViews() {
        ParticipantManager.render(); MatchingManager.render(); StatsManager.calculateAndRender();
      },

      saveState() {
        MatchingManager.saveCurrentMonthData();
        const payload = {
          participants: ParticipantManager.list, activeMonth: this.activeMonth,
          monthList: this.monthList, tournaments: this.tournaments
        };
        const jsonStr = JSON.stringify(payload);
        try { localStorage.setItem(this.STORAGE_KEY, jsonStr); } catch (e) {}
        if (typeof google !== 'undefined' && google.script && google.script.run) {
          google.script.run.saveCloudData(jsonStr);
        }
      },

      exportJsonBackup() {
        this.saveState();
        const raw = localStorage.getItem(this.STORAGE_KEY); if (!raw) { Toast.show('백업할 데이터가 없습니다.', 'error'); return; }
        const blob = new Blob([raw], { type: 'application/json' });
        const url = URL.createObjectURL(blob); const a = document.createElement('a'); a.href = url;
        a.download = `테니스대회_전체백업_${new Date().toISOString().slice(0, 10)}.json`;
        a.click(); URL.revokeObjectURL(url);
        Toast.show('전체 데이터 백업 파일이 다운로드되었습니다.');
      },

      importJsonBackup(file) {
        if (!AdminManager.checkAdmin('데이터 복원')) return;
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (e) => {
          try {
            const content = e.target.result; const parsed = JSON.parse(content);
            if (!parsed.participants) throw new Error('유효하지 않은 백업입니다.');
            this.applyLoadedData(parsed); this.renderAllViews(); this.saveState();
            Toast.show('전체 데이터가 성공적으로 복원되었습니다!');
          } catch (err) { Toast.show('JSON 복원 중 오류가 발생했습니다.', 'error'); }
        };
        reader.readAsText(file);
      }
    };

    document.addEventListener('DOMContentLoaded', () => { App.init(); });
  </script>
</body>
</html>
